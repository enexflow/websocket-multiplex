worker_processes 1;

events {
  worker_connections 1024;
}

# Plain TCP passthrough (no HTTP awareness needed for a WebSocket upgrade):
# approximates an ALB/Ingress that picks a backend per connection and keeps
# that connection pinned to it for its whole lifetime.
stream {
  upstream ws_multiplexer {
    server ws-multiplexer-1:8080;
    server ws-multiplexer-2:8080;
  }

  server {
    listen 8080;
    proxy_pass ws_multiplexer;
    # Generous idle timeout: a real ALB defaults to ~60s and will silently
    # drop long-idle OCPP connections unless raised - keep that gotcha in
    # mind for the real cluster (see plan Phase 5).
    proxy_timeout 3600s;
    # Short connect timeout so a dead backend fails over to the other
    # instance quickly instead of waiting on nginx's 60s default - observed
    # locally: without this, killing an instance mid-session left its
    # clients stuck reconnecting for ~30-40s before failover kicked in.
    # A real ALB/Ingress needs the same kind of check (target health check
    # interval/threshold), see plan Phase 5.
    proxy_connect_timeout 2s;
  }
}
